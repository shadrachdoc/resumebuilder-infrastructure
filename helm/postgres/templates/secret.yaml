# PostgreSQL Secret Template
# File: helm/postgres/templates/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.service.name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- range $key, $val := .Values.labels }}
    {{ $key }}: {{ $val }}
    {{- end }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  # Superuser credentials
  POSTGRES_USER: {{ .Values.postgresql.superuser.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.superuser.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.superuser.database | quote }}
  
  # Application user credentials
  APP_DB_USER: {{ .Values.postgresql.appuser.username | quote }}
  APP_DB_PASSWORD: {{ .Values.postgresql.appuser.password | quote }}
  APP_DB_NAME: {{ .Values.postgresql.appuser.database | quote }}