# Backend Helm Chart - Default Values (Development)
# File: helm/backend/values.yaml

namespace: resumebuilder-dev

# Docker Image Configuration
image:
  repository: shadrach85/resumebuilder-api
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  name: backend-service

# Resource Limits
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Laravel Application Config
laravel:
  appName: "Resume Builder API"
  appEnv: "production"
  appDebug: "false"
  appUrl: "http://backend-service"
  
  # Database
  database:
    connection: "pgsql"
    host: "postgres-service"
    port: "5432"
    database: "resumebuilder_dev"
    username: "resumeapp"
    password: "resumeapp@123"
  
  # Redis
  redis:
    host: "redis-service"
    port: "6379"
    password: ""
  
  # Cache & Session
  cacheStore: "redis"
  sessionDriver: "redis"
  queueConnection: "redis"

# Health Checks
# Health Checks
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 60  
  periodSeconds: 10
  timeoutSeconds: 10       
  failureThreshold: 5      

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30 
  periodSeconds: 10
  timeoutSeconds: 10      
  failureThreshold: 5      

# Labels
labels:
  app: backend
  component: api
  environment: development