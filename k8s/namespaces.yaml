# Resume Builder - Kubernetes Namespaces
# File: k8s/namespaces/namespaces.yaml
# Purpose: Create all project namespaces

---
# Development Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resumebuilder-dev
  labels:
    name: resumebuilder-dev
    environment: development
    project: resumebuilder

---
# Staging Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resumebuilder-staging
  labels:
    name: resumebuilder-staging
    environment: staging
    project: resumebuilder

---
# Production Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resumebuilder-production
  labels:
    name: resumebuilder-production
    environment: production
    project: resumebuilder

---
# ArgoCD Namespace (for GitOps deployment)
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    name: argocd
    purpose: gitops
    project: resumebuilder